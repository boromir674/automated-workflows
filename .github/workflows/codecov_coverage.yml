######################################
##     Reusable Codecov Workflow    ##
######################################

# Prerequisite is to pass in a CODECOV_TOKEN from https://app.codecov.io/


on:
  workflow_call:
    inputs:
      artifact_prefix:
        required: true
        type: string
        description: "Prefix of the Artifact Name to filter on and download from CI Artifacts."
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  upload_coverage:
    name: Upload Coverage XML data to Codecov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Get the Codecov binary
      - name: Get Codecov Binary
        run: |
          curl -Os https://uploader.codecov.io/latest/linux/codecov
          chmod +x codecov

      # DOWNLOAD XML FILES FROM ARTIFACTS
      - name: Download Artifacts filtered on input prefix
        uses: actions/download-artifact@v4
        with:
          path: coverage
          pattern: ${{ inputs.artifact_prefix }}*
          merge-multiple: true

      - run: ls -R coverage

      # Upload coverage reports to Codecov
      - name: Upload Coverage Reports to Codecov
        run: |
          for file in coverage*.xml; do

            OS_NAME=$(echo $file | sed -E "s/coverage-(\w+)-.*/\1/")
            PY_VERSION=$(echo $file | sed -E "s/coverage-\w+-(\d+\.\d+).*/\1/")

            echo
            echo "---> [INFO] Sending to Codecov: $file"
            echo
            ./codecov -f $file -e "OS=$OS_NAME,PYTHON=$PY_VERSION" --flags unittests --verbose

          done

      # If Verbose, Write to Workflow Output
      - name: Report Uploaded Coverage XML Files
        if: ${{ inputs.verbose }}
        run: |
          for file in coverage*.xml; do

            echo " - Codecov Upload: $file" >> $GITHUB_OUTPUT

          done
